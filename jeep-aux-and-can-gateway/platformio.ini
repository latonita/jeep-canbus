; jeep-aux-and-can-gateway
; ATmega328 in-radio board: VES/AUX + BT control (autonomous) + CAN-B AT gateway.
;
; Flashed over the ICSP header -- there is no serial bootloader, so pins 0/1 are
; dedicated to the AT link and the board is NOT reset when the port is opened.

[platformio]
default_envs = promini

[env]
lib_ldf_mode = deep+

[env:promini]
platform  = atmelavr
board     = pro16MHzatmega328
framework = arduino

; ICSP with an Arduino Mega 2560 running the stock ArduinoISP sketch. This is
; the route that works; FT232R synchronous bitbang ("-c ttl232r") never got a
; signature out of this board. Mega pin 10 -> the AVR RESET wire, and 50/52/51
; -> MISO/SCK/MOSI on ICSP1 pins 1/3/4. -P below is the MEGA's port, not the
; target's. Full pin table and wiring notes in docs/ISP-WIRING.md.
;
; avrdude 8.2 from scoop, NOT the Arduino IDE copy and not PlatformIO's bundled
; tool-avrdude: only the former has the "arduino_as_isp" programmer definition
; (stk500v1 at 19200, which is what the sketch speaks).
;
; The MCU is a plain ATmega328P despite the KiCad symbol saying ATmega328PB-AU:
; the silicon reports signature 1E 950F, so -p m328p. The PlatformIO board above
; is a 328p, which now matches the hardware exactly.
upload_protocol = custom
upload_command  = "C:/Users/latonita/scoop/apps/avrdude/current/avrdude.exe" -c arduino_as_isp -p m328p -P COM19 -U flash:w:$SOURCE:i

; The MCP2515 crystal is 16 MHz. For an 8 MHz board, add
;     -DCAN_CRYSTAL_8MHZ
; to build_flags below. Wrong choice = dead CAN bus; reasoning in Core/Config.h.

; SERIAL_TX_BUFFER_SIZE: stock is 64 bytes. The AT@SM background frame stream
; writes a line per received frame, and one full CAN_RX_DRAIN_MAX pass is about
; 4 x 17 = 68 bytes -- just over the stock ring, which would make the stream
; drop frames on every busy drain. 128 costs 64 bytes of the ~1300 free (see
; AT@ST RAM=) and covers a drain pass roughly 8x over. Raise to 256 if AT@ST
; ever reports a non-zero SD=.
build_flags =
    -Wall
    -Wextra
    -Werror=return-type
    -ffunction-sections
    -fdata-sections
    -DSERIAL_TX_BUFFER_SIZE=128

; Host-side tests for the dependency-free logic (AtLine, IsoTpFc).
;
; `pio test -e native` needs gcc/g++ on PATH -- the native platform hard-codes
; those names and an extra_script override does not stick for `pio test`. With
; only clang available, run scripts/run-host-tests.sh instead; it compiles and
; runs the same suites. Either way the AVR build is unaffected.
[env:native]
platform     = native
test_framework = unity
build_flags  =
    -std=gnu++14
    -Wall
    -Wextra
    -DUNIT_TEST
build_src_filter = -<*>
