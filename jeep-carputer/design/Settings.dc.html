<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
  <style>
    body { margin:0; background:#0B0907; }
    a { color:#FFA31A; } a:hover { color:#FFC46B; }
  </style>
</helmet>
<div style="width:240px;height:320px;background:#0B0907;font-family:'Barlow Semi Condensed','Arial Narrow',sans-serif;display:flex;flex-direction:column;overflow:hidden;">

  <div style="height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid #241C13;font-size:12px;letter-spacing:0.04em;color:#9A6A22;">
    <span style="color:#FFA31A;font-weight:600;">14:22</span>
    <span>RUN</span>
    <span style="display:flex;align-items:center;gap:5px;">LINK<span style="width:6px;height:6px;border-radius:50%;background:#FFA31A;display:inline-block;"></span></span>
  </div>

  <div style="height:28px;flex-shrink:0;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #241C13;">
    <span style="font-size:11px;font-weight:600;letter-spacing:0.22em;color:#FFA31A;">SETTINGS</span>
  </div>

  <div style="flex-shrink:0;background:#140C08;border-bottom:1px solid #241C13;padding:9px 12px 10px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <span style="font-size:14px;font-weight:600;letter-spacing:0.08em;color:#FFA31A;">INVERT COLOURS</span>
      <span style="flex-shrink:0;min-width:38px;height:20px;box-sizing:border-box;border:1px solid #4A3A22;border-radius:2px;display:flex;align-items:center;justify-content:center;padding:0 7px;font-size:11px;font-weight:600;letter-spacing:0.14em;color:#6B4E20;">OFF</span>
    </div>
    <div style="font-size:10px;letter-spacing:0.06em;color:#6B4E20;margin-top:3px;">for direct sunlight</div>
  </div>

  <div style="flex-shrink:0;background:#140C08;border-bottom:1px solid #241C13;padding:9px 12px 10px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <span style="font-size:14px;font-weight:600;letter-spacing:0.08em;color:#FFA31A;">ORIENTATION</span>
      <span style="flex-shrink:0;height:20px;box-sizing:border-box;border:1px solid #4A3A22;border-radius:2px;display:flex;align-items:center;justify-content:center;padding:0 7px;font-size:11px;font-weight:600;letter-spacing:0.14em;color:#6B4E20;">PORTRAIT</span>
    </div>
    <div style="font-size:10px;letter-spacing:0.06em;color:#6B4E20;margin-top:3px;">set once, at the bracket</div>
  </div>

  <div style="flex-shrink:0;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #1C150E;">
    <span style="width:74px;height:7px;background:#1C150E;display:inline-block;"></span>
    <span style="width:38px;height:16px;box-sizing:border-box;border:1px solid #1C150E;border-radius:2px;display:inline-block;"></span>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="flex-shrink:0;padding:7px 12px 8px;border-top:1px solid #241C13;">
    <div style="font-size:9px;font-weight:600;letter-spacing:0.16em;color:#6B4E20;margin-bottom:5px;">INFO</div>
    <div style="display:flex;align-items:baseline;justify-content:space-between;height:17px;">
      <span style="font-size:10px;font-weight:600;letter-spacing:0.14em;color:#6B4E20;">LINK</span>
      <span style="font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:15px;font-weight:500;letter-spacing:0.04em;color:#9A6A22;">STREAM</span>
    </div>
    <div style="display:flex;align-items:baseline;justify-content:space-between;height:17px;">
      <span style="font-size:10px;font-weight:600;letter-spacing:0.14em;color:#6B4E20;">ADAPTER</span>
      <span style="font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:15px;font-weight:500;letter-spacing:0.04em;color:#9A6A22;">v2.1</span>
    </div>
    <div style="display:flex;align-items:baseline;justify-content:space-between;height:17px;">
      <span style="font-size:10px;font-weight:600;letter-spacing:0.14em;color:#6B4E20;">BUS</span>
      <span style="font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:15px;font-weight:500;letter-spacing:0.04em;color:#9A6A22;">151 f/s</span>
    </div>
  </div>

  <div style="height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:7px;">
    <span style="width:5px;height:5px;border-radius:50%;background:#3A2C18;"></span>
    <span style="width:5px;height:5px;border-radius:50%;background:#3A2C18;"></span>
    <span style="width:5px;height:5px;border-radius:50%;background:#3A2C18;"></span>
    <span style="width:5px;height:5px;border-radius:50%;background:#3A2C18;"></span>
    <span style="width:5px;height:5px;border-radius:50%;background:#FFA31A;"></span>
  </div>

</div>
</x-dc>
</body>
</html>
