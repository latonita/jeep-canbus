<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
  <style>
    body { margin:0; background:#0B0907; }
    a { color:#FFA31A; } a:hover { color:#FFC46B; }
  </style>
</helmet>
<div style="width:240px;height:320px;background:#0B0907;font-family:'Barlow Semi Condensed','Arial Narrow',sans-serif;display:flex;flex-direction:column;overflow:hidden;">

  <div style="height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid #241C13;font-size:12px;letter-spacing:0.04em;color:#9A6A22;">
    <span style="color:#FFA31A;font-weight:600;">14:22</span>
    <span>RUN</span>
    <span style="display:flex;align-items:center;gap:5px;">LINK<span style="width:6px;height:6px;border-radius:50%;background:#FFA31A;display:inline-block;"></span></span>
  </div>

  <div style="height:24px;flex-shrink:0;display:flex;align-items:baseline;justify-content:space-between;padding:4px 10px 0;">
    <span style="font-size:13px;font-weight:600;letter-spacing:0.14em;color:#FFA31A;">TYRES</span>
    <span style="font-size:11px;letter-spacing:0.04em;color:#6B4E20;">READ 4s AGO</span>
  </div>

  <div style="flex-grow:1;display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));grid-template-rows:repeat(2, minmax(0, 1fr));gap:1px;background:#241C13;margin:6px 0 0;">

    <div style="background:#0B0907;display:flex;flex-direction:column;justify-content:center;padding:0 12px;">
      <div style="font-size:10px;font-weight:600;letter-spacing:0.16em;color:#6B4E20;">LF</div>
      <div style="display:flex;align-items:baseline;gap:4px;">
        <span style="font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:46px;font-weight:500;line-height:0.95;color:#FFA31A;">33</span>
        <span style="font-size:11px;color:#6B4E20;">psi</span>
      </div>
      <div style="font-size:11px;letter-spacing:0.04em;color:#9A6A22;">+1 since cold</div>
    </div>

    <div style="background:#0B0907;display:flex;flex-direction:column;justify-content:center;padding:0 12px;">
      <div style="font-size:10px;font-weight:600;letter-spacing:0.16em;color:#6B4E20;">RF</div>
      <div style="display:flex;align-items:baseline;gap:4px;">
        <span style="font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:46px;font-weight:500;line-height:0.95;color:#FFA31A;">32</span>
        <span style="font-size:11px;color:#6B4E20;">psi</span>
      </div>
      <div style="font-size:11px;letter-spacing:0.04em;color:#9A6A22;">+1 since cold</div>
    </div>

    <div style="background:#0B0907;display:flex;flex-direction:column;justify-content:center;padding:0 12px;">
      <div style="font-size:10px;font-weight:600;letter-spacing:0.16em;color:#6B4E20;">LR</div>
      <div style="display:flex;align-items:baseline;gap:4px;">
        <span style="font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:46px;font-weight:500;line-height:0.95;color:#FFA31A;">33</span>
        <span style="font-size:11px;color:#6B4E20;">psi</span>
      </div>
      <div style="font-size:11px;letter-spacing:0.04em;color:#9A6A22;">+2 since cold</div>
    </div>

    <div style="background:#0B0907;display:flex;flex-direction:column;justify-content:center;padding:0 12px;">
      <div style="font-size:10px;font-weight:600;letter-spacing:0.16em;color:#8A2E1C;">RR</div>
      <div style="display:flex;align-items:baseline;gap:4px;">
        <span style="font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:46px;font-weight:500;line-height:0.95;color:#FF4426;">30</span>
        <span style="font-size:11px;color:#8A2E1C;">psi</span>
      </div>
      <div style="font-size:11px;letter-spacing:0.04em;color:#FF4426;">4 under target</div>
    </div>

  </div>

  <div style="height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-top:1px solid #241C13;">
    <span style="font-size:10px;font-weight:600;letter-spacing:0.16em;color:#6B4E20;">SPARE</span>
    <span style="display:flex;align-items:baseline;gap:4px;">
      <span style="font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:20px;font-weight:500;color:#6B4E20;">8</span>
      <span style="font-size:11px;color:#6B4E20;">psi &#183; unconfirmed sensor</span>
    </span>
  </div>

  <div style="height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-top:1px solid #241C13;background:#140C08;">
    <span style="font-size:11px;letter-spacing:0.06em;color:#9A6A22;">TARGET 30&#8211;34 psi</span>
    <span style="font-size:11px;font-weight:600;letter-spacing:0.08em;color:#FF4426;">1 LOW</span>
  </div>

  <div style="height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:7px;">
    <span style="width:5px;height:5px;border-radius:50%;background:#3A2C18;"></span>
    <span style="width:5px;height:5px;border-radius:50%;background:#FFA31A;"></span>
    <span style="width:5px;height:5px;border-radius:50%;background:#3A2C18;"></span>
    <span style="width:5px;height:5px;border-radius:50%;background:#3A2C18;"></span>
    <span style="width:5px;height:5px;border-radius:50%;background:#3A2C18;"></span>
  </div>

</div>
</x-dc>
</body>
</html>
