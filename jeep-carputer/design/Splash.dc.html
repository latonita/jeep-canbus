<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
  <style>
    body { margin:0; background:#0B0907; }
    a { color:#FFA31A; } a:hover { color:#FFC46B; }
    @keyframes splashIn {
      0%   { opacity:0; transform:scale(0.965); }
      100% { opacity:1; transform:scale(1); }
    }
    .splash-mark { animation: splashIn 620ms cubic-bezier(.2,.7,.3,1) both; }
    .splash-id   { animation: splashIn 620ms cubic-bezier(.2,.7,.3,1) 220ms both; }
  </style>
</helmet>
<div style="width:240px;height:320px;background:#0B0907;font-family:'Barlow Semi Condensed','Arial Narrow',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;">

  <div class="splash-mark" style="display:flex;align-items:center;">
    <svg width="228" height="47" viewBox="0 0 244 50" fill="none">
      <!-- WK face, traced from the 2004 front view. Each lamp is two OVERLAPPING circles,
           outer slightly larger, bottoms near-level, and the cluster stands a touch taller
           than the grille. Grille: seven slots at ~1:1.8 in a ~4:1 surround. -->
      <circle cx="18" cy="25" r="15.5" stroke="#FFA31A" stroke-width="2.6"></circle>
      <circle cx="41" cy="25" r="14" stroke="#FFA31A" stroke-width="2.6"></circle>
      <circle cx="226" cy="25" r="15.5" stroke="#FFA31A" stroke-width="2.6"></circle>
      <circle cx="203" cy="25" r="14" stroke="#FFA31A" stroke-width="2.6"></circle>
      <rect x="62" y="10" width="120" height="30" rx="4.5" stroke="#FFA31A" stroke-width="2.6"></rect>
      <rect x="67"     y="14" width="12" height="22" rx="1.5" fill="#FFA31A"></rect>
      <rect x="83.33"  y="14" width="12" height="22" rx="1.5" fill="#FFA31A"></rect>
      <rect x="99.67"  y="14" width="12" height="22" rx="1.5" fill="#FFA31A"></rect>
      <rect x="116"    y="14" width="12" height="22" rx="1.5" fill="#FFA31A"></rect>
      <rect x="132.33" y="14" width="12" height="22" rx="1.5" fill="#FFA31A"></rect>
      <rect x="148.67" y="14" width="12" height="22" rx="1.5" fill="#FFA31A"></rect>
      <rect x="165"    y="14" width="12" height="22" rx="1.5" fill="#FFA31A"></rect>
    </svg>
  </div>

  <div class="splash-id" style="position:absolute;left:0;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:3px;">
    <div style="width:48px;height:1px;background:#3A2C18;margin-bottom:11px;"></div>
    <div style="font-size:14px;font-weight:600;letter-spacing:0.17em;color:#9A6A22;text-transform:uppercase;">latonita&#8209;carputer</div>
    <div style="font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:13px;letter-spacing:0.1em;color:#4A3A22;">v1.0</div>
  </div>

</div>
</x-dc>
</body>
</html>
