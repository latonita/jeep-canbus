; jeep-carputer -- ESP32-S3 in-car computer
;
; Reads vehicle data through the ATmega328 board in the radio (see
; ../jeep-aux-and-can-gateway) over UART with an ELM327-style AT protocol, and
; shows it on the Waveshare ESP32-S3-Touch-LCD-2.8 via LVGL.
;
; ESP-IDF only -- no Arduino libraries. Build under WSL, where the toolchain
; and framework-espidf are installed:
;   wsl -- bash -lc 'cd /mnt/d/Repos/car/jeep-canbus/jeep-carputer && pio run'

[platformio]
default_envs = s3

; NOTE on managed components: the LVGL work will need ESP Component Registry
; dependencies (esp_lvgl_port, lvgl, waveshare/esp_lcd_touch_cst328 or
; _cst3530), and PlatformIO's espidf integration handles idf_component.yml
; poorly. Nothing needed so far pulls a registry component, so this is not yet
; a problem -- when it becomes one, either vendor those components into
; components/ or move this project to native idf.py + CMake. See ARCHITECTURE.md.
[env:s3]
platform  = espressif32
framework = espidf
board     = esp32-s3-devkitc-1
; No PlatformIO board definition exists for the Waveshare 2.8, and devkitc-1
; defaults to 8 MB flash with no PSRAM -- override both.
board_build.flash_size = 16MB
board_build.psram_type = opi
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra

; Host tests for core/, which is pure C++ with zero ESP-IDF dependencies.
; Runs anywhere with a compiler; scripts/run-host-tests.sh needs no PlatformIO
; at all and is the primary path. This env exists for CI convenience.
[env:native]
platform = native
build_src_filter = -<*>
